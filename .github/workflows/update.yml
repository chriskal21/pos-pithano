name: Ενημέρωση προβλέψεων

on:
  schedule:
    # Κάθε μέρα στις 05:10 και 14:10 UTC (08:10 και 17:10 ώρα Ελλάδας το καλοκαίρι, μία ώρα νωρίτερα τον χειμώνα)
    - cron: "10 5,14 * * *"
  workflow_dispatch: {}      # κουμπί «Run workflow» για χειροκίνητη ενημέρωση
  push:
    branches: [main]
    paths: ["site/index.html", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Λήψη δεδομένων και υπολογισμός
        run: python scripts/update.py

      - name: Αποθήκευση δεδομένων στο αποθετήριο
        run: |
          git config user.name "pos-pithano-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/history.json data/cache.json
          git diff --cached --quiet || git commit -m "Ενημέρωση δεδομένων $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
