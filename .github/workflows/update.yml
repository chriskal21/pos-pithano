name: Ενημέρωση προβλέψεων

on:
  schedule:
    # Πλήρης ενημέρωση: κάθε μέρα στις 05:10 και 14:10 UTC (08:10 και 17:10 ώρα Ελλάδας το καλοκαίρι, μία ώρα νωρίτερα τον χειμώνα)
    - cron: "10 5,14 * * *"
    # Ελαφριά ενημέρωση κάθε ώρα τις ώρες των αγώνων (12:40–22:40 UTC): νέα αποτελέσματα και πιθανότητες,
    # χωρίς αποθήκευση στο αποθετήριο, ώστε να μη μεγαλώνει το ιστορικό του git
    - cron: "40 12-22 * * *"
  workflow_dispatch: {}      # κουμπί «Run workflow» για χειροκίνητη ενημέρωση
  push:
    branches: [main]
    paths: ["site/index.html", "site/manifest.webmanifest", "site/sw.js", "site/icons/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  LIGHT: ${{ github.event.schedule == '40 12-22 * * *' && '1' || '' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Λήψη δεδομένων και υπολογισμός
        run: python scripts/update.py

      - name: Αποθήκευση δεδομένων στο αποθετήριο
        if: env.LIGHT != '1'
        run: |
          git config user.name "samurai-bet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/history.json data/cache.json
          [ -f site/tables.json ] && git add site/tables.json || true
          git diff --cached --quiet || git commit -m "Ενημέρωση δεδομένων $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
